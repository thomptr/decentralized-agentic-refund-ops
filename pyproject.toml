[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-foundation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "aiokafka>=0.10",
    "structlog>=24",
    "typer>=0.12",
    "pyyaml>=6",
]

[project.optional-dependencies]
# HTTP surface for local AgentCore CLI — not required for the Kafka domain agent
http = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]
# Read-only Streamlit demo UI (apps/demo_ui) — observer dashboard on :8200
ui = [
    "streamlit>=1.36",
    "httpx>=0.27",
]
llm = [
    "boto3>=1.34",
]
langgraph = [
    "langgraph>=0.2",
    "langchain-aws>=0.2",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "testcontainers[kafka]>=4",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "bandit>=1.7",
    "pyyaml>=6",
]

[project.scripts]
agent-foundation = "agent_foundation.cli:app"
demo-customer-resolution = "apps.agents.customer_resolution.main:main"
demo-billing-entitlement = "apps.agents.billing_entitlement.main:main"
demo-billing-entitlement-http = "apps.agents.billing_entitlement.http_app:run"
demo-risk-fraud = "apps.agents.risk_fraud.main:main"
demo-risk-fraud-http = "apps.agents.risk_fraud.http_app:run"
demo-ui = "apps.demo_ui.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_foundation", "packages"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: mark test as requiring a live Kafka broker (via testcontainers)"]
# Safety net: no single test (including testcontainers startup + async work) may
# hang the suite. The signal method interrupts blocked asyncio calls on Linux/CI.
timeout = 180
timeout_method = "signal"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.mypy]
strict = true
python_version = "3.12"

# boto3/botocore live in the optional `llm` extra, so they are absent from the
# `dev` install used in CI. Ignore missing imports here rather than per-line so
# the check passes whether or not the SDK happens to be installed.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
