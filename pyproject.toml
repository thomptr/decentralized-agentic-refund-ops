[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-foundation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "aiokafka>=0.10",
    "structlog>=24",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "testcontainers[kafka]>=4",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "bandit>=1.7",
]

[project.scripts]
agent-foundation = "agent_foundation.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_foundation", "packages"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: mark test as requiring a live Kafka broker (via testcontainers)"]
# Safety net: no single test (including testcontainers startup + async work) may
# hang the suite. The signal method interrupts blocked asyncio calls on Linux/CI.
timeout = 180
timeout_method = "signal"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.mypy]
strict = true
python_version = "3.12"
