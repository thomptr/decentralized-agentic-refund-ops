services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.2
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr
      - INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr
      - INTERNAL://redpanda:29092,EXTERNAL://localhost:9092
      - --pandaproxy-addr
      - INTERNAL://0.0.0.0:28082,EXTERNAL://0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - INTERNAL://redpanda:28082,EXTERNAL://localhost:8082
      - --smp 1
      - --memory 1G
      - --mode dev-container
      - --default-log-level=warn
      - --set redpanda.auto_create_topics_enabled=true
    ports:
      - "9092:9092"
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda:29092
    depends_on:
      redpanda:
        condition: service_healthy

