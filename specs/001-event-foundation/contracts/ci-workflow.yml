# CI Workflow Contract
# Canonical reference for .github/workflows/ci.yml
# Implementation copies this to the repository root .github/workflows/ directory.
#
# Required status checks (configure in GitHub branch protection for main):
#   - "Lint & Type Check"
#   - "Security Scan"
#   - "Unit & Contract Tests"

name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: ruff lint
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: mypy type check
        run: uv run mypy src/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: pip-audit (dependency CVE scan)
        run: uv run pip-audit

      - name: bandit (Python SAST)
        run: uv run bandit -r src/ -ll

  test:
    name: Unit & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit and contract tests
        run: uv run pytest tests/unit/ tests/contract/ -v
